<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INVOY - Send. Get Paid.</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;700&family=Syne:wght@600&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#FDFBF6;color:#1A1A1A}
.serif{font-family:'Instrument Serif',serif}.syne{font-family:'Syne',sans-serif}
.invoy-input{background:#F9F7F2;border:1px solid #EAE6DE}.invoy-input:focus{border-color:#111;outline:none}
#previewLogo{width:72px;height:72px;border-radius:18px} #previewLogo img{width:100%;height:100%;object-fit:contain;border-radius:18px}
@media print{.no-print{display:none!important}}
</style></head><body>
<header class="max-w-6xl mx-auto px-6 py-8 flex justify-between items-center no-print">
<div class="flex items-center gap-3"><div class="w-9 h-9 bg-black text-white flex items-center justify-center serif text-xl rounded-[10px]">I</div><span class="serif text-[24px]">invoy.</span></div>
<div id="freeLeft" class="text-[11px] tracking-widest border px-3 py-1.5 rounded-full bg-white">5 FREE / 5</div></header>
<div class="max-w-6xl mx-auto px-6 grid lg:grid-cols-[1.1fr_0.9fr] gap-8 pb-20">
<div class="no-print"><div class="bg-white border border-[#EAE6DE] rounded-[24px] p-7">
<h2 class="serif text-[32px]">Create</h2><div class="mt-5"><label class="text-[11px] uppercase tracking-widest opacity-60">Logo</label><input type="file" id="logoInput" accept="image/*" class="mt-2 block text-sm"></div>
<div class="grid grid-cols-2 gap-4 mt-4"><div><input id="fromName" class="invoy-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Your Studio"><input id="upiId" class="invoy-input w-full mt-3 px-4 py-3 rounded-xl text-sm" placeholder="upi id"></div><div><input id="toName" class="invoy-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Bill To"><input id="projectName" class="invoy-input w-full mt-3 px-4 py-3 rounded-xl text-sm" placeholder="Project name"></div></div>
<div id="itemsList" class="space-y-3 mt-6"></div><button onclick="addItem()" class="text-xs mt-3 px-3 py-1.5 rounded-full border">+ Add item</button>
<button onclick="generate()" class="w-full mt-8 bg-black text-white py-4 rounded-xl text-sm">Generate PDF →</button>
</div><div class="bg-white border border-[#EAE6DE] rounded-[24px] p-6 mt-6"><h3 class="serif text-xl">History</h3><div id="history" class="mt-3 space-y-2"></div><p id="noHist" class="text-xs opacity-40 mt-2">Shows name + date</p></div></div>

<div class="lg:sticky top-8"><div id="invoiceCard" class="bg-[#F6F5F1] border border-[#E8E6DF] rounded-[28px] overflow-hidden shadow-[0_16px_48px_rgba(0,0,0,0.08)]">
<div class="bg-[#0F1410] text-[#F6F5F1] p-8">
<div class="flex justify-between text-[10px] tracking-[0.2em] uppercase opacity-60"><span id="invNumTop">INVOICE • 001</span><span id="dateTop">01 OCT 2026</span></div>
<div class="mt-10 flex gap-6"><div id="previewLogo" class="bg-white/10 border border-white/20 flex items-center justify-center text-[10px] tracking-widest shrink-0">LOGO</div><div><p id="fromPreview" class="syne text-[12px] tracking-[0.2em] uppercase opacity-60">YOUR STUDIO</p><p id="projectPreview" class="serif text-[22px] leading-tight mt-1">Brand Identity</p></div></div>
<div class="mt-10"><p class="text-[10px] tracking-[0.2em] uppercase opacity-50">TOTAL DUE</p><p id="totalBig" class="serif text-[56px] leading-none mt-2">₹15,000</p><div class="w-full h-[1px] bg-white/20 mt-6"></div>
<p class="text-[11px] mt-4 tracking-wide"><span class="opacity-50 uppercase">Billed to:</span> <span id="billToBig" class="serif text-[16px] ml-2">Acme Inc</span></p></div>
</div>
<div class="p-8 bg-[#F6F5F1]">
<div id="previewItems" class="space-y-3 text-[13px]"></div>
<div class="border-t border-[#D8D5CC] mt-6 pt-4 flex justify-between text-[13px]"><span class="opacity-60">Subtotal</span><span id="subSmall">₹15,000</span></div>
<div class="mt-8 flex justify-between items-end border-t border-black pt-6">
<div><p class="text-[10px] uppercase tracking-widest opacity-60 mb-2">Scan to pay • UPI</p><div id="qr" class="p-2 bg-white rounded-xl border"></div><p id="upiSmall" class="text-[10px] opacity-40 mt-2 font-mono"></p></div>
<div class="text-right"><p class="text-[10px] uppercase opacity-50">Amount</p><p id="totalSmall" class="serif text-[28px]">₹15,000</p></div>
</div>
<div class="mt-8 flex justify-between text-[9px] opacity-40 uppercase tracking-widest"><span>ID: <span id="verifyId">INV-2026-XXXX</span> • invoy.co</span><span>Generated via INVOY</span></div>
</div></div></div></div>
<script>
let items=[{name:'Brand Identity',qty:1,price:15000}];
let freeLeft=parseInt(localStorage.getItem('invoy_left_v5')||'5'); let hist=JSON.parse(localStorage.getItem('invoy_hist')||'[]');
function updFree(){document.getElementById('freeLeft').innerText=freeLeft>0?freeLeft+' FREE / 5':'LIMIT — BUY PRO';}
function renderHist(){const h=document.getElementById('history'); if(!hist.length){h.innerHTML=''; document.getElementById('noHist').style.display='block'; return;} document.getElementById('noHist').style.display='none'; h.innerHTML=hist.slice().reverse().map(x=>`<div class="flex justify-between p-3 rounded-xl bg-[#F9F7F2] border text-[12px]"><span>${x.client} • ${x.date}</span><span>₹${x.total.toLocaleString('en-IN')}</span></div>`).join('');}
updFree(); renderHist();
function renderItems(){const el=document.getElementById('itemsList'); el.innerHTML=''; items.forEach((it,i)=>{el.innerHTML+=`<div class="grid grid-cols-[1fr_60px_90px_24px] gap-2"><input value="${it.name}" oninput="items[${i}].name=this.value;upd()" class="invoy-input px-3 py-2.5 rounded-xl text-sm"><input type="number" value="${it.qty}" oninput="items[${i}].qty=+this.value||0;upd()" class="invoy-input px-3 py-2.5 rounded-xl text-sm"><input type="number" value="${it.price}" oninput="items[${i}].price=+this.value||0;upd()" class="invoy-input px-3 py-2.5 rounded-xl text-sm"><button onclick="items.length>1&&items.splice(${i},1)&&renderItems()" class="opacity-40">✕</button></div>`}); upd();}
function addItem(){items.push({name:'',qty:1,price:0}); renderItems();}
document.getElementById('logoInput').addEventListener('change',e=>{const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{document.getElementById('previewLogo').innerHTML=`<img src="${ev.target.result}">`;}; r.readAsDataURL(f);});
function calc(){return items.reduce((s,it)=>s+it.qty*it.price,0);}
function upd(){const total=calc(); document.getElementById('totalBig').innerText='₹'+total.toLocaleString('en-IN'); document.getElementById('totalSmall').innerText='₹'+total.toLocaleString('en-IN'); document.getElementById('subSmall').innerText='₹'+total.toLocaleString('en-IN'); document.getElementById('billToBig').innerText=document.getElementById('toName').value||'Client'; document.getElementById('fromPreview').innerText=document.getElementById('fromName').value||'YOUR STUDIO'; document.getElementById('projectPreview').innerText=document.getElementById('projectName').value||items[0]?.name||'Project'; document.getElementById('previewItems').innerHTML=items.map(it=>`<div class="flex justify-between"><span>${it.name||'Item'} <span class="opacity-40">× ${it.qty}</span></span><span>₹${(it.qty*it.price).toLocaleString('en-IN')}</span></div>`).join(''); const upi=document.getElementById('upiId').value||'demo@upi'; document.getElementById('upiSmall').innerText=upi; const link=`upi://pay?pa=${upi}&pn=${document.getElementById('fromName').value||'Studio'}&am=${total}&cu=INR`; document.getElementById('qr').innerHTML=''; new QRCode(document.getElementById('qr'),{text:link,width:112,height:112,colorDark:"#0F1410",colorLight:"#FFFFFF"}); const now=new Date(); document.getElementById('dateTop').innerText=now.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase();}
['fromName','toName','upiId','projectName'].forEach(id=>document.getElementById(id).addEventListener('input',upd));
function generate(){if(freeLeft<=0){alert('Buy Pro'); return;} const total=calc(); const inv='INV-'+new Date().getFullYear()+'-'+Math.floor(Math.random()*9000+1000); document.getElementById('invNumTop').innerText='INVOICE • '+inv; document.getElementById('verifyId').innerText=inv; const client=document.getElementById('toName').value||'Client'; hist.push({client,total,date:new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short'}),inv}); if(hist.length>5) hist=hist.slice(-5); localStorage.setItem('invoy_hist',JSON.stringify(hist)); freeLeft--; localStorage.setItem('invoy_left_v5',freeLeft); updFree(); renderHist(); window.print();}
renderItems();
</script></body></html>
